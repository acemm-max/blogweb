name: blogweb-integration

services:
  mysql:
    image: mysql:8.0
    command: ["--server-id=101", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_DATABASE: blogweb_integration
      MYSQL_USER: blogweb_test
      MYSQL_PASSWORD: blogweb_test_password
      MYSQL_ROOT_PASSWORD: blogweb_test_root
    ports: ["127.0.0.1:23306:3306"]
    volumes:
      - integration-mysql:/var/lib/mysql
      - ./sql/users.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ./sql/articles.sql:/docker-entrypoint-initdb.d/02-articles.sql:ro
      - ./infra/integration/replication.sql:/docker-entrypoint-initdb.d/03-replication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--requirepass", "blogweb_test_redis"]
    ports: ["127.0.0.1:26379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: blogweb_test_minio
      MINIO_ROOT_PASSWORD: blogweb_test_minio_password
    ports: ["127.0.0.1:29000:9000", "127.0.0.1:29001:9001"]
    volumes: ["integration-minio:/data"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.23
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:29200:9200"]
    volumes: ["integration-es:/usr/share/elasticsearch/data"]
  canal:
    image: canal/canal-server:v1.1.7
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["127.0.0.1:21111:11111"]
    volumes:
      - ./infra/integration/instance.properties:/home/admin/canal-server/conf/example/instance.properties:ro

volumes:
  integration-mysql:
  integration-minio:
  integration-es:
