logging:
  level:
    com.ziv: INFO

spring:
  sql:
    init:
      mode: never
  application:
    name: Blogweb
  profiles:
    default: local
  # Disable the generated development user; database authentication comes next.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
