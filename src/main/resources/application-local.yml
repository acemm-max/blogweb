spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blogweb}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
    username: ${DB_USERNAME:blogweb}
    password: ${DB_PASSWORD:blogweb_local_password}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:blogweb_redis_local_password}
      connect-timeout: 3s
      timeout: 3s
      repositories:
        enabled: false
  session:
    timeout: 30m
    redis:
      namespace: blogweb:session
